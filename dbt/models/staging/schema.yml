version: 2

models:
  - name: stg_products
    columns:
      - name: product_id
        data_tests: # En v2 se prefiere 'data_tests' sobre 'tests'
          - not_null # Regla 1: Completitud

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null # Regla 1: Completitud

  - name: stg_sales
    columns:
      - name: sale_id
        data_tests:
          - not_null # Regla 1: Completitud
          - unique   # Regla 3: Unicidad
      - name: customer_id
        data_tests:
          - not_null
          - relationships: # Regla 4: Integridad Referencial adaptada a dbt v2
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships: # Regla 4: Integridad Referencial adaptada a dbt v2
              arguments:
                to: ref('stg_products')
                field: product_id