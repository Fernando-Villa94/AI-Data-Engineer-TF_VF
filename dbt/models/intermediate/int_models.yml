version: 2

models:
  - name: int_customer_monthly_aggregates
    description: "Agregaciones mensuales de transacciones por cliente y categorías clave para el modelo de ML."
    

    data_tests:
      - unique:
          column_name: "customer_id || '-' || cast(codmes as string)"

    columns:
      - name: customer_id
        description: "Identificador único del cliente."
        data_tests:
          - not_null

      - name: codmes
        description: "Periodo numérico en formato YYYYMM."
        data_tests:
          - not_null

      - name: monto_mes
        description: "Suma total de ventas del cliente en el mes."
        data_tests:
          - not_null

      - name: frec_bikes_mes
        description: "Cantidad de bicicletas compradas en el mes."
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0


      - name: frec_clothing_mes
        description: "Cantidad de prendas de ropa compradas en el mes."
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0

      - name: frec_accessories_mes
        description: "Cantidad de accesorios comprados en el mes."
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0      