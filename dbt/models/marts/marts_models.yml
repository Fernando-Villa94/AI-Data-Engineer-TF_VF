version: 2

models:

  - name: customer_360
    description: "Tablón analítico optimizado e histórico para inferencia de propensión con LightGBM."
    
    data_tests:
      - unique:
          column_name: "customer_id || '-' || cast(periodo_analisis as string)"

    columns:

      - name: recencia_dias
        description: "Días desde la última compra hasta el cierre del periodo."
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0

      - name: monto_prom_6m
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0
      - name: frec_accessories_prom_6m
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0
      - name: yearly_income
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0

      - name: frec_clothing_prom_6m
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0
      - name: children_at_home
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0
      - name: total_children
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0          

      - name: number_cars
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0
      - name: frec_bikes_prom_2m
        data_tests:
          - not_null
          - es_mayor_o_igual_a:
              arguments:
                valor_minimo: 0


  - name: dim_products
    description: "Dimensión Maestra de Productos con jerarquías de categorías y marcas."
    columns:
      - name: product_id
        description: "Clave primaria única identificadora del producto."
        data_tests:
          - unique
          - not_null
      - name: price
        description: "Precio base del producto."
        data_tests:
          - not_null 

  - name: dim_customers
    description: "Dimensión Maestra de Clientes con atributos sociodemográficos consolidados."
    columns:
      - name: customer_id
        description: "Clave primaria única identificadora del cliente."
        data_tests:
          - unique
          - not_null

  - name: fct_sales
    description: "Tabla de hechos central que registra todas las transacciones de ventas."
    columns:
      - name: sale_id
        description: "Identificador único de la transacción."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Clave foránea que conecta con la dimensión de clientes."
        data_tests:
          - not_null
          - relationships:
             arguments:
                to: ref('dim_customers')
                field: customer_id        

      - name: product_id
        description: "Clave foránea que conecta con la dimensión de productos."
        data_tests:
          - not_null
          - relationships:
             arguments:
                to: ref('dim_products')
                field: product_id 

      - name: quantity
        description: "Cantidad de unidades vendidas."
        data_tests:
          - not_null  

      - name: sales_total
        description: "Monto total calculado de la venta (Cantidad * Precio Unitario)."
        data_tests:
          - not_null  