name: 'adventureworks_pipeline'
version: '1.0.0'
config-version: 2


profile: 'default'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  
clean-targets:        
  - "target"
  - "dbt_packages"

# =====================================================================
# CONFIGURACIÓN DE MODELOS 
# =====================================================================
models:
  adventureworks_pipeline:
    staging:
      +materialized: view
      +database: workspace     
      +schema: catalog_staging  
    
    intermediate: 
      +materialized: view
      +database: workspace      
      +schema: catalog_intermediate 

    marts: 
      +materialized: view
      +database: workspace      
      +schema: catalog_marts 